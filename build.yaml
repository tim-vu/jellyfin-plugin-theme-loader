framework: "net9.0"
overview: "Install and switch Jellyfin Web themes from local theme packages"
description: >
  Theme Loader gives Jellyfin administrators a cleaner alternative to pasting
  custom CSS into the built-in Branding settings. Install self-contained theme
  ZIP packages, keep each theme's CSS and assets together, switch themes from a
  dedicated settings page, and serve fonts, images, and other theme files from
  your own Jellyfin server instead of depending on remote URLs.
